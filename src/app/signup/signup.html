<div class="max-w-md mx-auto p-8">
  <div class="form-container">
    <h1 class="text-2xl font-bold text-gray-900 text-center mb-2">Create account</h1>
    <p class="text-sm text-gray-500 text-center mb-6">Sign up to get started with NgRx App</p>

    <form class="signup-form" [formGroup]="signupForm" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
          formControlName="email"
        />
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          autocomplete="new-password"
          placeholder="••••••••"
          formControlName="password"
        />
      </div>

      <div class="form-actions">
        <button type="submit" class="submit-button">Sign up</button>
      </div>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      Already have an account?
      <a routerLink="/login" class="text-blue-600 hover:text-blue-800 font-medium">Sign in</a>
    </p>
  </div>
</div>
