<div class="p-8">
  <div class="max-w-6xl mx-auto mb-6 flex items-center justify-between">
    <h1 class="text-2xl font-bold text-gray-900">Courses</h1>
    <a
      routerLink="/courses/add"
      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors"
    >
      Add Course
    </a>
  </div>

  <div class="max-w-6xl mx-auto flex flex-wrap gap-6 justify-center">
    @for (course of courses(); track course.id) {
      <article
        (click)="selectCourse(course)"
        [class.border-green-500]="isSelected(course.id)"
        [class.border-2]="isSelected(course.id)"
        class="max-w-sm w-full border border-gray-200 bg-white font-sans shadow-sm overflow-hidden rounded-lg cursor-pointer transition-colors"
      >
        <header class="px-5 py-4 bg-white flex items-start justify-between gap-2">
          <h2 class="text-base font-bold text-gray-900 leading-snug">{{ course.title }}</h2>
          <a
            [routerLink]="['/courses', course.id]"
            (click)="$event.stopPropagation()"
            class="text-xs font-semibold text-blue-600 hover:text-blue-800 shrink-0"
          >
            #{{ course.id }}
          </a>
        </header>

        <section>
          <img [src]="'/' + course.image" [alt]="course.title" class="w-full h-40 object-cover" />
        </section>

        <section class="bg-gray-100 px-5 py-4">
          <h3 class="text-sm font-bold text-gray-900 mb-2">About {{ course.title }}</h3>
          <p class="text-sm text-gray-700 leading-relaxed line-clamp-3">
            {{ course.description }}
          </p>
        </section>

        <footer
          class="bg-gray-100 px-5 py-4 border-t border-gray-200 flex items-center justify-between"
        >
          <span class="text-base font-bold text-gray-900">${{ course.price }}</span>

          <div class="flex items-center gap-2">
            <a
              [routerLink]="['/courses', course.id]"
              (click)="$event.stopPropagation()"
              class="w-9 h-9 rounded-full bg-green-500 hover:bg-green-600 flex items-center justify-center text-white transition-colors"
              aria-label="View course"
            >
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                <path
                  fill-rule="evenodd"
                  d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
                  clip-rule="evenodd"
                />
              </svg>
            </a>

            <a
              [routerLink]="['/courses', course.id, 'edit']"
              (click)="$event.stopPropagation()"
              class="w-9 h-9 rounded-full bg-blue-500 hover:bg-blue-600 flex items-center justify-center text-white transition-colors"
              aria-label="Edit course"
            >
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                <path
                  d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"
                />
              </svg>
            </a>

            <button
              type="button"
              class="w-9 h-9 rounded-full bg-red-500 hover:bg-red-600 flex items-center justify-center text-white transition-colors"
              aria-label="Delete course"
              (click)="$event.stopPropagation(); deleteCourse(course.id)"
            >
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                <path
                  fill-rule="evenodd"
                  d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z"
                  clip-rule="evenodd"
                />
              </svg>
            </button>
          </div>
        </footer>
      </article>
    } @empty {
      <p class="text-gray-500 text-center w-full py-12">No courses yet. Add your first course!</p>
    }
  </div>
</div>
