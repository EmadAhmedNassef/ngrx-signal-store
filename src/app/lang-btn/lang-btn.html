<label for="lang-select" class="sr-only" i18n>Language</label>
<div class="relative inline-flex items-center">
  <select
    id="lang-select"
    (change)="onLocaleChange($event)"
    class="appearance-none cursor-pointer rounded-md border border-gray-700 bg-gray-800 py-2 pl-3 pr-9 text-sm font-medium text-gray-200 shadow-sm transition-colors hover:border-gray-600 hover:bg-gray-700 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-gray-500"
  >
    @for (local of localList; track local.code) {
      <option [value]="local.code" [selected]="local.code === currentLocale">
        {{ local.label }}
      </option>
    }
  </select>
  <span
    class="pointer-events-none absolute inset-y-0 inset-e-0 flex items-center pe-2.5 text-gray-400"
    aria-hidden="true"
  >
    <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
  </span>
</div>
