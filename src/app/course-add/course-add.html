<div class="max-w-xl mx-auto p-8">
  <a routerLink="/courses" class="text-sm text-blue-600 hover:text-blue-800"
    >&larr; Back to Courses</a
  >
  <h1 class="text-2xl font-bold text-gray-900 mt-4">Add Course</h1>
  <div class="form-container">
    <form class="course-form" [formGroup]="coursesForm" (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="title">Title</label>
        <input
          type="text"
          placeholder="e.g., Introduction to Web Development"
          formControlName="title"
        />
      </div>

      <div class="form-field">
        <label for="description">Description</label>
        <textarea
          rows="5"
          placeholder="Provide a detailed description of the course"
          formControlName="description"
        ></textarea>
      </div>

      <div class="form-field">
        <label for="author">Author</label>
        <input type="text" placeholder="e.g., John Doe" formControlName="author" />
      </div>

      <div class="form-field">
        <label for="price">Price</label>
        <input type="number" step="0.01" placeholder="e.g., 99.99" formControlName="price" />
      </div>

      <div class="form-field file-upload-field" [class.has-file]="selectedFileName">
        <label for="image">Course Image</label>
        <div class="file-input-wrapper">
          <input
            type="file"
            id="image"
            accept="image/*"
            formControlName="image"
            #fileInput
            (change)="onFileSelected($event)"
          />
          <button type="button" class="browse-button" (click)="fileInput.click()">
            Choose File
          </button>
          <span class="file-name">{{ selectedFileName || 'No file chosen' }}</span>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="submit-button">Create Course</button>
        <button type="reset" class="cancel-button">Clear Form</button>
      </div>
    </form>
  </div>
</div>
